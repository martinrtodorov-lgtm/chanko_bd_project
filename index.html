<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chanko's Bachelor Party</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317140f'/%3E%3Cpath d='M16 5l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L16 21.5l-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1z' fill='%23d8b45a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- Start screen -->
  <section id="start-screen" class="screen is-active">
    <div class="start-menu">
      <button id="btn-start" class="menu-button" type="button">Start</button>
      <button id="btn-continue" class="menu-button" type="button" disabled>Continue</button>
      <p id="loading" class="loading"></p>
    </div>
  </section>

  <!-- Game screen -->
  <section id="game-screen" class="screen">
    <div class="viewport">
      <canvas id="game-canvas" width="1280" height="704"></canvas>

      <div id="hud" class="hud">
        <div class="hud-row"><span>Wisdom</span><b>+ 1</b></div>
        <div class="hud-row"><span>Intelligence</span><b>+ 2</b></div>
        <div class="hud-row"><span>Charisma</span><b>+ 3</b></div>
      </div>

      <div class="controls-hint">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move</span>
        <span><kbd>E</kbd> talk</span>
        <span><kbd>A</kbd> attack</span>
        <span><kbd>T</kbd> teams</span>
        <span><kbd>I</kbd> info</span>
      </div>
    </div>
  </section>

  <!-- Overlay host for menus and dialogue -->
  <div id="overlay" class="overlay"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
